<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHRI Lab</title>
<link rel="icon" type="image/png" href="logo-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="logo"><img src="logo-sm.png" alt="AHRI.Lab"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="members.html">Members</a>
      <a href="project.html">Project</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="wrap">
      <div class="label">Lab Log</div>
      <h1>Gallery<span>.</span></h1>
      <p>연구실의 기록. 성공보다 실패가 조금 더 많습니다.</p>
    </div>
  </div>
  <section>
    <div class="wrap">
      <div class="grid gallery">
        <article class="box post">
          <figure class="slides" data-imgs="https://picsum.photos/seed/ahri1/800/600 https://picsum.photos/seed/ahri2/800/600 https://picsum.photos/seed/ahri3/800/600">
            <img src="https://picsum.photos/seed/ahri1/800/600" alt="로봇 경진대회 현장" loading="lazy"><figcaption>FIG. 01</figcaption>
            <button type="button" class="prev" aria-label="이전 사진">‹</button><button type="button" class="next" aria-label="다음 사진">›</button>
          </figure>
          <div class="body"><time>2026.10.12</time><h3>로봇 경진대회 본선 진출</h3><p>Coffee Unit-7으로 교내 로봇 경진대회 본선에 진출했습니다. 시연 도중 컵을 두 번 떨어뜨렸지만 심사위원분들은 웃어주셨습니다.</p></div>
        </article>
      </div>
    </div>
  </section>
</main>

<script>
  // 사진 추가: figure.slides 의 data-imgs 에 URL을 공백으로 구분해 넣으면 됩니다.
  document.querySelectorAll(".slides").forEach(f => {
    const imgs = f.dataset.imgs.split(/\s+/), img = f.querySelector("img"), cap = f.querySelector("figcaption");
    let i = 0;
    const go = d => { i = (i + d + imgs.length) % imgs.length; img.src = imgs[i]; if (!matchMedia("(prefers-reduced-motion: reduce)").matches) img.animate([{ opacity: 0 }, { opacity: 1 }], 250); cap.textContent = `FIG. 0${i + 1} / 0${imgs.length}`; };
    f.querySelector(".prev").onclick = () => go(-1);
    f.querySelector(".next").onclick = () => go(1);
    go(0);
  });
</script>

<footer>
  <div class="wrap">
    <span>© 2025 AHRI Lab. All robots reserved.</span>

  </div>

</body>
</html>
